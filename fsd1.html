<!DOCTYPE html>
<html>
  <head>
    <title>a target Example</title>
  </head>
  <body>
    <h1>This is a target attribute</h1>
    <a href="https://www.youtube.com/" target="_blank">Visit Youtube website</a>
    <p>
      If you set the target attribute to "_blank", the link will open in a new browser window or a new tab.
    </p>
  </body>
</html>
